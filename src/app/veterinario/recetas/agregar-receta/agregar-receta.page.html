<ion-header class="ion-no-border">
  <app-header backButton="/recetas" title="Nueva Receta"></app-header>
</ion-header>

<ion-content class="fondo" [fullscreen]="true" style="padding-bottom: 80px;">
  <ion-card class="ion-card-atencion">
    <h3 style="text-align: center;">Buscar Tutor</h3>

    <ion-card-content>
      <!-- Buscador tutor -->
      <ion-item class="buscador" lines="none">
        <ion-icon name="search-outline" slot="start"></ion-icon>
        <ion-input
          [(ngModel)]="busquedaTutor"
          (ionInput)="filtrarTutores()"
          placeholder="Ingrese nombre del tutor">
        </ion-input>
      </ion-item>

      <!-- Lista de tutores filtrados -->
      <ion-list *ngIf="tutoresFiltrados.length > 0">
        <ion-item button detail *ngFor="let tutor of tutoresFiltrados" (click)="seleccionarTutor(tutor)" lines="none">
          <ion-label>
            {{ tutor.nombre_tutor }} {{ tutor.apellidos_tutor }}
          </ion-label>
        </ion-item>
      </ion-list>

      <!-- Selector de mascota según tutor -->
      <div *ngIf="tutorSeleccionado">
        <h3 style="text-align: center;">Mascotas de {{ tutorSeleccionado.nombre_tutor }}</h3>
        <ion-item class="buscador" lines="none">
          <ion-select label="Mascota" [(ngModel)]="mascotaSeleccionada" interface="popover">
            <ion-select-option *ngFor="let mascota of tutorSeleccionado.mascota" [value]="mascota">
              {{ mascota.masc_nom }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </div>
    </ion-card-content>
  </ion-card>

  <!-- Formulario tratamiento/indicaciones -->
  <ion-card *ngIf="mascotaSeleccionada" class="ion-card-atencion">
    <h2 style="text-align: center;">RECETA MÉDICA</h2>

    <ion-card-content>
      <form #form="ngForm">
        <!-- Indicaciones generales -->
        <ion-item>
          <ion-label position="stacked">Indicaciones generales</ion-label>
          <ion-textarea
            [(ngModel)]="tratamiento_indicaciones"
            name="indicaciones"
            placeholder="Ej: Reposo, control de temperatura..."
            required>
          </ion-textarea>
        </ion-item>

        <!-- Botón agregar medicamento -->
        <ion-item lines="none" class="ion-align-items-center">
          <ion-label>Rp</ion-label>
          <ion-button fill="clear" color="primary" (click)="agregarMedicamento()" slot="end">
            Agregar <ion-icon name="add-circle-outline"></ion-icon>
          </ion-button>
        </ion-item>

        <!-- Lista dinámica medicamentos -->
        <div *ngFor="let med of tratamientoList; let i = index"
             style="border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; position: relative;">
          <ion-button
            fill="clear"
            color="danger"
            size="small"
            style="position: absolute; top: 0.25rem; right: 0.25rem; z-index: 10;"
            (click)="eliminarMedicamento(i)">
            <ion-icon name="close-outline"></ion-icon>
          </ion-button>

          <ion-item>
            <ion-label position="stacked">Medicamento</ion-label>
            <ion-input
              [(ngModel)]="med.nombre"
              name="nombreMedicamento{{i}}"
              placeholder="Ej: Amoxicilina 500mg"
              required>
            </ion-input>
          </ion-item>

          <ion-item>
            <ion-label position="stacked">Dosis</ion-label>
            <ion-input
              [(ngModel)]="med.dosis"
              name="dosisMedicamento{{i}}"
              placeholder="Ej: 1 comprimido cada 12 hrs"
              required>
            </ion-input>
          </ion-item>

          <ion-item lines="none">
            <ion-label position="stacked">Duración</ion-label>
            <ion-input
              [(ngModel)]="med.duracion"
              name="duracionMedicamento{{i}}"
              placeholder="Ej: 7 días"
              required>
            </ion-input>
          </ion-item>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" shape="round" color="primary" (click)="guardarReceta()">
      Guardar Receta
    </ion-button>
  </ion-toolbar>
</ion-footer>
