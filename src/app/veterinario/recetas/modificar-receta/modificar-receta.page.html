<ion-header class="ion-no-border">
  <app-header backButton="/recetas"></app-header>
</ion-header>

<ion-content class="fondo" [fullscreen]="true">
  <h2 style="text-align: center;">Editar tratamiento</h2>

  <ion-card class="card3">
    <ion-list class="formulario-editar">

      <!-- Mostrar el nombre de la mascota asociada a la receta -->
      <ion-item *ngIf="receta?.mascota?.masc_nom" lines="none">
        <ion-label>
          Receta de {{ receta.mascota.masc_nom }}
        </ion-label>
      </ion-item>

      <!-- Indicaciones generales -->
      <ion-item>
        <ion-label position="stacked">Indicaciones generales</ion-label>
        <ion-textarea
          [(ngModel)]="tratamiento_indicaciones"
          name="indicaciones"
          placeholder="Ej: Reposo, control de temperatura..."
          required>
        </ion-textarea>
      </ion-item>

      <!-- Botón agregar medicamento -->
      <ion-item lines="none" class="ion-align-items-center">
        <ion-label>Rp</ion-label>
        <ion-button fill="clear" color="primary" (click)="agregarMedicamento()" slot="end">
          Agregar <ion-icon name="add-circle-outline"></ion-icon>
        </ion-button>
      </ion-item>

      <!-- Lista dinámica medicamentos -->
      <div *ngFor="let med of tratamientoList; let i = index"
           style="border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; position: relative;">
        <ion-button
          fill="clear"
          color="danger"
          size="small"
          style="position: absolute; top: 0.25rem; right: 0.25rem; z-index: 10;"
          (click)="eliminarMedicamento(i)">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button>

        <!-- Selección de medicamento -->
        <ion-item>
          <ion-label position="stacked">Medicamento</ion-label>
          <ion-select
            [(ngModel)]="med.id_medicamento"
            name="medicamento{{i}}"
            placeholder="Selecciona medicamento"
            interface="popover"
            required>
            <ion-select-option
              *ngFor="let m of medicamentosDisponibles"
              [value]="m.id_medicamento">
              {{ m.nombre_medicamento }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Dosis</ion-label>
          <ion-input
            [(ngModel)]="med.dosis"
            name="dosisMedicamento{{i}}"
            placeholder="Ej: 1 comprimido cada 12 hrs"
            required>
          </ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-label position="stacked">Duración</ion-label>
          <ion-input
            [(ngModel)]="med.duracion"
            name="duracionMedicamento{{i}}"
            placeholder="Ej: 7 días"
            required>
          </ion-input>
        </ion-item>
      </div>

    </ion-list>

    <!-- Botones de acción -->
    <ion-button expand="block" class="boton-guardar-generico" (click)="guardarCambiosReceta()">Guardar Cambios</ion-button>
    <ion-button expand="block" class="boton-eliminar" (click)="eliminarReceta()" style="margin-top: 10px;">Eliminar Receta</ion-button>

  </ion-card>
</ion-content>
