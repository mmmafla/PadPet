<app-header  backButton="/home" title="Agenda"></app-header>

<ion-content>
  <ion-button expand="full" (click)="loginWithGoogle()">
    Iniciar sesión con Google
  </ion-button>

  <ion-button expand="full" color="secondary" (click)="getCalendarEvents()" [disabled]="!isAuthenticated">
    Ver eventos del calendario
  </ion-button>

  <ion-list *ngIf="events.length > 0">
    <ion-list-header>
      Eventos
    </ion-list-header>
    <ion-item *ngFor="let event of events">
      <ion-label>
        <h2>{{ event.summary }}</h2>
        <p *ngIf="event.start?.dateTime">
          {{ event.start.dateTime | date:'short' }}
        </p>
        <p *ngIf="!event.start?.dateTime && event.start?.date">
          {{ event.start.date | date:'longDate' }}
        </p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-card *ngIf="events.length === 0 && isAuthenticated">
    <ion-card-content>
      No se encontraron eventos.
    </ion-card-content>
  </ion-card>
</ion-content>
