<ion-header>
  <app-header backButton="/home" title="Dashboard"></app-header>
</ion-header>

<ion-content class="fondo" [fullscreen]="true">

  <!-- Filtro de mes y año -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Resumen mensual</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-item>
              <ion-label position="floating">Mes</ion-label>
              <ion-select 
                [(ngModel)]="mesSeleccionado" 
                (ionChange)="obtenerEstadisticasDashboard()"
                interface="popover"
                class="select-small">
                
                <ion-select-option *ngFor="let mes of meses; let i = index" [value]="i + 1">
                  {{ mes }}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item>
              <ion-label position="floating">Año</ion-label>
              <ion-select 
                [(ngModel)]="annoSeleccionado" 
                (ionChange)="obtenerEstadisticasDashboard()"
                interface="popover"
                class="select-small">
                
                <ion-select-option *ngFor="let anio of anios" [value]="anio">
                  {{ anio }}
                </ion-select-option>
              </ion-select>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-card-content>
  </ion-card>

  <!-- Estadísticas del mes -->
<ion-card *ngIf="estadisticas">
  <ion-card-header>
    <ion-card-title>Total atenciones: {{ estadisticas.total_atenciones }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>

    <ion-card *ngIf="estadisticas">

      <ion-card-content>

        <!-- Gráfico -->
        <div style="width: 100%; min-height: 300px; background-color: #fff; border: 1px solid #ddd;">
          <app-chart [data]="getEspeciesData()" [labels]="getEspeciesLabels()"></app-chart>
        </div>

      </ion-card-content>
    </ion-card>

    <!-- Especies atendidas -->
    <div class="section" *ngIf="estadisticas.especies && getKeys(estadisticas.especies).length > 0">
      <h3>Especies atendidas</h3>
      <ul>
        <li *ngFor="let especie of getKeys(estadisticas.especies)">
          {{ especie }}: {{ estadisticas.especies[especie] }} atenciones
        </li>
      </ul>
    </div>

    <!-- Motivos de consulta -->
    <div class="section">
      <h3>Motivos de consulta</h3>
      <ul>
        <li *ngFor="let motivo of getKeys(estadisticas.motivos)">
          {{ motivo }}: {{ estadisticas.motivos[motivo] }} atenciones
        </li>
      </ul>
    </div>

    <!--


      <div class="section">
        <h3>Sistemas comprometidos</h3>
        <ul>
          <li *ngFor="let sistema of getKeys(estadisticas.sistemas)">
            {{ sistema }}: {{ estadisticas.sistemas[sistema] }}
          </li>
        </ul>
      </div>


      <div class="section" *ngIf="getKeys(estadisticas.alimentacion).length > 0">
        <h3>Tipo de alimentación</h3>
        <ul>
          <li *ngFor="let tipo of getKeys(estadisticas.alimentacion)">
            {{ tipo }}: {{ estadisticas.alimentacion[tipo] }} atenciones
          </li>
        </ul>
      </div>


      <div class="section" *ngIf="getKeys(estadisticas.estado_sensorial).length > 0">
        <h3>Estado sensorial</h3>
        <ul>
          <li *ngFor="let estado of getKeys(estadisticas.estado_sensorial)">
            {{ estado }}: {{ estadisticas.estado_sensorial[estado] }} atenciones
          </li>
        </ul>
      </div>


      <div class="metrics">
        <p><strong>Promedio de temperatura:</strong> {{ estadisticas.temperatura_prom | number:'1.1-2' }} °C</p>
        <p><strong>Promedio de peso:</strong> {{ estadisticas.peso_prom | number:'1.1-2' }} kg</p>
      </div>

    -->

  </ion-card-content>
</ion-card>

  <!-- Cargando -->
  <ion-spinner *ngIf="cargando" name="dots"></ion-spinner>

</ion-content>
