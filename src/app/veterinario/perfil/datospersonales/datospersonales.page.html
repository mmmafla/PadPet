<app-header backButton="/perfil" title="Datos personales"></app-header>

<ion-content class="fondo">
  <ion-card class="ion-card">
    <form [formGroup]="form" (ngSubmit)="actualizarDatos()">
      <ion-list>
        <ion-item>
          <ion-input label="Nombre" type="text" formControlName="nombre_vet"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Apellidos " type="text" formControlName="apellidos_vet"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Email" type="email" formControlName="email_vet"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="RUN" type="text" formControlName="run_vet" readonly></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Teléfono" type="tel" formControlName="celular_vet"></ion-input>
        </ion-item>
        <ion-item>
          <ion-input label="Domicilio" type="text" formControlName="direccion_vet"></ion-input>
        </ion-item>
 <!--------->
        <ion-item>
          <ion-select label="Región" formControlName="id_region" interface="popover" placeholder="Selecciona una región">
            <ion-select-option *ngFor="let region of regiones" [value]="region.id_region">
              {{ region.nombre_region }}
            </ion-select-option>
          </ion-select>
        </ion-item>
 <!--------->
        <ion-item>
          <ion-select label="Ciudad" formControlName="id_ciudad" interface="popover" placeholder="Selecciona una ciudad">
            <ion-select-option *ngFor="let ciudad of ciudades" [value]="ciudad.id_ciudad">
              {{ ciudad.nombre_ciudad }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </ion-list>
      <ion-button expand="block"  (click)="actualizarDatos()" class="boton-editar" [disabled]="form.invalid" shape="round">Actualizar información</ion-button>
    </form>
  </ion-card>
</ion-content>
